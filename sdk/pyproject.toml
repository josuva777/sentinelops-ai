[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinelops-sdk"
version = "1.0.0"
description = "In-Line Interception and Deterministic Guardrail SDK for Autonomous AI Agents"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
